<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="cadastro">

        <h1>Criar conta</h1>

        <p>Crie sua conta para entrar na biblioteca.</p>

        <form>

            <input
                type="text" id="usuario"
                placeholder="Nome de usuário"
                required
            >

            <input
                type="email" id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password" id="senha"
                placeholder="Senha"
                required
            >

            <button id="entrar">
                Criar conta
            </button>

            <script src="script.js"></script>

        </form>

    </main>

</body>

</html>
